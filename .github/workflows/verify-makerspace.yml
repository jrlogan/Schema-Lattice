name: Verify Makerspace runtime candidate
on:
  pull_request:
permissions:
  contents: read
jobs:
  verify-makerspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: candidate
    steps:
      - uses: actions/checkout@v4
        with:
          repository: makehaven/makerspace-network
          ref: '9cc4013818833976ef8b533e82f8f6f80f05d431'
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - name: Verify candidate commit and runtime
        run: |
          test "$(git rev-parse HEAD)" = "9cc4013818833976ef8b533e82f8f6f80f05d431"
          node -e "if (process.versions.node !== '22.23.4') process.exit(1)"
      - run: npm ci
      - run: npm run validate
      - run: npm run test:standards
      - run: npm run build
      - run: npm --prefix functions ci
      - run: npm --prefix functions run build
